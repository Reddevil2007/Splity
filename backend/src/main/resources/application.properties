spring.application.name=splitcloud

# Database connection comes from environment variables. On EC2 they are written
# into Tomcat's setenv.sh by the instance's user data; locally the defaults
# match docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/splitcloud}
spring.datasource.username=${DB_USER:splitcloud}
spring.datasource.password=${DB_PASSWORD:splitcloud}
spring.datasource.hikari.maximum-pool-size=5
# Fail fast (5 s) instead of the default 30 s, so the health check reports a dead database quickly.
spring.datasource.hikari.connection-timeout=5000

# Hibernate creates and updates tables from the entity classes.
# Fine for this project; a production system would use versioned Flyway migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health
