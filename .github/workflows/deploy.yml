# Continuous Deployment: every push to main (or a manual "Run workflow") builds
# the app, provisions/updates the Azure infrastructure with Terraform, deploys
# the WAR to App Service and publishes the frontend to the storage static website.
#
# Authentication uses OIDC (OpenID Connect) federation: GitHub proves its identity
# to Azure with a short-lived token, so no password or key is stored anywhere.
#
# Required repository variables (Settings > Secrets and variables > Actions > Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_LOCATION
# Optional:
#   ALERT_EMAIL   email address that receives alerts
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'centralindia' }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_location: ${{ vars.AZURE_LOCATION || 'centralindia' }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure settings are present
        run: |
          if [ -z "$ARM_CLIENT_ID" ] || [ -z "$ARM_TENANT_ID" ] || [ -z "$ARM_SUBSCRIPTION_ID" ]; then
            echo "::error::Add AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and AZURE_LOCATION as repository variables, then re-run."
            exit 1
          fi

      # ---------- build the backend ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build backend WAR (runs the tests too)
        working-directory: backend
        run: mvn -B package

      # ---------- infrastructure ----------
      - name: Sign in to Azure (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Register resource providers and create the Terraform state store
        run: |
          exec > >(tee -a deploy.log) 2>&1
          for p in Microsoft.Web Microsoft.DBforPostgreSQL Microsoft.Insights Microsoft.OperationalInsights \
                   Microsoft.AlertsManagement Microsoft.Storage Microsoft.Network; do
            az provider register --namespace "$p" --wait
          done
          STATE_RG="splitcloud-tfstate"
          STATE_SA="sctf$(echo "$ARM_SUBSCRIPTION_ID" | tr -d '-' | cut -c1-16)"
          az group create --name "$STATE_RG" --location "$LOCATION" --output none
          if ! az storage account show --name "$STATE_SA" --resource-group "$STATE_RG" --output none 2>/dev/null; then
            az storage account create --name "$STATE_SA" --resource-group "$STATE_RG" --location "$LOCATION" \
              --sku Standard_LRS --kind StorageV2 --min-tls-version TLS1_2 --allow-blob-public-access false --output none
          fi
          KEY=$(az storage account keys list --account-name "$STATE_SA" --resource-group "$STATE_RG" --query "[0].value" -o tsv)
          az storage container create --name tfstate --account-name "$STATE_SA" --account-key "$KEY" --output none
          echo "STATE_RG=$STATE_RG" >> "$GITHUB_ENV"
          echo "STATE_SA=$STATE_SA" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          exec > >(tee -a ../deploy.log) 2>&1
          terraform init -input=false -no-color \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=$STATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=splitcloud.tfstate" \
            -backend-config="use_oidc=true"

      - name: Clean up a diagnostic setting left half-created by an interrupted run
        working-directory: infra
        run: |
          if ! terraform state list | grep -q "azurerm_monitor_diagnostic_setting.api"; then
            APP_ID=$(terraform state show -no-color azurerm_linux_web_app.api 2>/dev/null | awk -F'"' '/^ *id *=/{print $2; exit}')
            if [ -n "$APP_ID" ]; then
              az monitor diagnostic-settings delete --name send-to-log-analytics --resource "$APP_ID" 2>/dev/null || true
            fi
          fi

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -no-color 2>&1 | tee -a ../deploy.log; exit ${PIPESTATUS[0]}

      - name: Terraform apply (first run takes about 10-15 minutes)
        working-directory: infra
        run: |
          # Azure management calls occasionally drop mid-request; one retry covers that.
          for attempt in 1 2; do
            if terraform apply -auto-approve -input=false -no-color 2>&1 | tee -a ../deploy.log; [ "${PIPESTATUS[0]}" -eq 0 ]; then
              exit 0
            fi
            echo "apply attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Read Terraform outputs
        working-directory: infra
        run: |
          {
            echo "RESOURCE_GROUP=$(terraform output -raw resource_group)"
            echo "WEB_APP=$(terraform output -raw web_app_name)"
            echo "API_URL=$(terraform output -raw api_url)"
            echo "APP_URL=$(terraform output -raw app_url)"
            echo "STORAGE_ACCOUNT=$(terraform output -raw storage_account_name)"
          } >> "$GITHUB_ENV"

      # ---------- release ----------
      - name: Deploy the WAR to App Service (Tomcat 10.1)
        run: |
          az webapp deploy --resource-group "$RESOURCE_GROUP" --name "$WEB_APP" \
            --src-path backend/target/splitcloud.war --type war --restart true 2>&1 | tee -a deploy.log
          exit ${PIPESTATUS[0]}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend against the deployed API
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ env.API_URL }}
        run: |
          npm ci
          npm run build

      - name: Publish frontend to the storage static website
        run: |
          exec > >(tee -a deploy.log) 2>&1
          KEY=$(az storage account keys list --account-name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query "[0].value" -o tsv)
          # Hashed asset files never change, so browsers may cache them for a year.
          az storage blob upload-batch --account-name "$STORAGE_ACCOUNT" --account-key "$KEY" \
            --destination '$web' --source frontend/dist --overwrite --output none \
            --content-cache-control "public, max-age=31536000, immutable" --pattern "assets/*"
          # index.html must always be revalidated so users pick up new asset names.
          az storage blob upload --account-name "$STORAGE_ACCOUNT" --account-key "$KEY" \
            --container-name '$web' --name index.html --file frontend/dist/index.html --overwrite \
            --content-type "text/html" --content-cache-control "no-cache" --output none

      - name: Smoke test (waits for the API to report healthy)
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 20 "$API_URL/api/health" | grep -q '"status":"UP"'; then
              echo "API healthy after $attempt checks"
              exit 0
            fi
            echo "waiting for API ($attempt/40)"
            sleep 15
          done
          echo "::error::API did not become healthy within 10 minutes. Check App Service > Log stream in the Azure portal."
          exit 1

      - name: Report errors
        if: failure()
        run: |
          # Surface the end of the failing step's output as annotations on the run page
          touch deploy.log
          grep -A14 "^Error:\|│ Error:\|ERROR:" deploy.log | grep -v "^--$" | head -60 > errors.txt || true
          [ -s errors.txt ] || tail -40 deploy.log > errors.txt
          split -l 10 errors.txt chunk_ 2>/dev/null || true
          for c in chunk_*; do
            [ -f "$c" ] && echo "::error title=deploy::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$c")"
          done
          true

      - name: Summary
        if: always()
        run: |
          {
            echo "## SplitCloud deployment"
            echo ""
            echo "- App: ${APP_URL:-not available}"
            echo "- API health: ${API_URL:-not available}/api/health"
            echo "- Resource group: ${RESOURCE_GROUP:-not available}"
          } >> "$GITHUB_STEP_SUMMARY"
