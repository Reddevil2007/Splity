# Tears down every Azure resource Terraform created, to stop spending credit.
# Run it manually from the Actions tab and type "destroy" to confirm.
name: Destroy Azure infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete all SplitCloud resources'
        required: true

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_location: ${{ vars.AZURE_LOCATION || 'centralindia' }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Terraform destroy
        working-directory: infra
        run: |
          STATE_SA="sctf$(echo "$ARM_SUBSCRIPTION_ID" | tr -d '-' | cut -c1-16)"
          terraform init -input=false \
            -backend-config="resource_group_name=splitcloud-tfstate" \
            -backend-config="storage_account_name=$STATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=splitcloud.tfstate" \
            -backend-config="use_oidc=true"
          terraform destroy -auto-approve -input=false
