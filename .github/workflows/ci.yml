# Continuous Integration: runs on every push and pull request.
# Needs no AWS credentials, so it always runs; a failure here blocks merging.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 17, Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile, run unit and API tests, package WAR
        run: mvn -B verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler and test failures as annotations on the run summary
          grep -E "\[ERROR\]|FAILURE|Tests run:.*Fail|expected|Caused by|Exception" build.log \
            | grep -v "Re-run Maven\|-> \[Help\|full stack trace\|For more information" \
            | head -60 > errors.txt || true
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -A6 -E "FAILURE|ERROR" "$f" | head -30 >> errors.txt
          done
          split -l 12 errors.txt chunk_
          for c in chunk_*; do
            echo "::error title=build::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$c")"
          done
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: splitcloud-war
          path: backend/target/splitcloud.war

  frontend:
    name: Frontend (React, Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  infrastructure:
    name: Infrastructure (Terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Check formatting
        run: terraform fmt -check -diff -recursive
      - name: Validate configuration
        run: |
          terraform init -backend=false -input=false
          terraform validate
