# One-off live check of the deployed site. Runs only on the ops-health-check branch.
name: Live health check

on:
  push:
    branches: [ops-health-check]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check API and website
        run: |
          API=https://splitcloud-api-346myx.azurewebsites.net/api/health
          WEB=https://splitcloudweb346myx.z7.web.core.windows.net/
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -s -o api.txt -w '%{http_code}' --max-time 60 "$API" || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 20
          done
          BODY=$(head -c 300 api.txt | tr '\n' ' ')
          WCODE=$(curl -s -o web.html -w '%{http_code}' --max-time 30 "$WEB" || echo 000)
          TITLE=$(grep -o '<title>[^<]*' web.html | head -1 | sed 's/<title>//')
          echo "::notice title=api::HTTP $CODE body: $BODY"
          echo "::notice title=web::HTTP $WCODE title: $TITLE"
